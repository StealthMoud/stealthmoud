<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">StealthMoud — Mahmoud Mohseni</title>
  <desc id="desc">Web security, backend systems, and open source. Understand the system. Test the assumptions. A request diagram illustrates identity, input, and access checks across a trust boundary.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#24404c" stroke-width="0.6"/>
    </pattern>
  </defs>
  <style>
    .wordmark { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; font-weight: 700; letter-spacing: -4px; fill: #edf5f4; }
    .tagline { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; fill: #edf5f4; }
    .label { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #9fb7c3; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #edf5f4; }
    .trace { fill: none; stroke: #28434f; stroke-width: 1.5; }
    .panel { fill: #102530; stroke: #28434f; stroke-width: 1.5; }
    .mark { fill: none; stroke: #69d6cd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .packet { animation: inspect 4.5s ease-in-out 1; }
    @keyframes inspect { 0% { transform: translateX(-10px); opacity: 0; } 20% { opacity: 1; } 65% { transform: translateX(45px); } 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { .packet { animation: none; } }
  </style>
