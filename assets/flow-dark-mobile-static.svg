<svg xmlns="http://www.w3.org/2000/svg" width="640" height="354" viewBox="0 0 640 354" role="img" aria-labelledby="title desc">
<title id="title">The research loop</title>
<desc id="desc">Scope: define the boundaries. Inspect: follow the request. Reproduce: verify the behavior. Document: keep the evidence.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#27402f" stroke-width="0.6"/>
  </pattern>
  <pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse">
    <path d="M0 1H4" stroke="#e3f0e5" stroke-opacity=".035"/>
  </pattern>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="type-clip"><rect class="type-mask" x="24" y="-23" width="325" height="33"/></clipPath>
  <clipPath id="glitch-cut"><path d="M0 145H700V159H0ZM0 174H700V183H0Z"/></clipPath>
</defs>
<style>
  text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e3f0e5; }
  .muted { fill: #9aafa0; }
  .accent { fill: #b6f45a; }
  .cyan { fill: #6ae5f1; }
  .line { stroke: #294431; fill: none; }
  .panel { fill: #0c1810; stroke: #294431; }
  .wordmark { font-size: 86px; font-weight: 800; letter-spacing: -5px; fill: #b6f45a; }
  .sweep { animation: radar 12s linear infinite; transform-origin: 0 0; }
  .ping { animation: ping 12s cubic-bezier(.18,.65,.3,1) infinite; }
  .ping-b { animation-delay: -4s; }
  .ping-c { animation-delay: -8s; }
  .type-mask { animation: typing 12s steps(24,end) infinite; }
  .cursor { animation: cursor 1.2s steps(1,end) infinite; }
  .cursor-ready { animation: ready 12s steps(1,end) infinite; }
  .phase { fill: #9aafa0; animation: phase 12s steps(1,end) infinite; }
  .phase-b { animation-name: phase-b; }
  .phase-c { animation-name: phase-c; }
  .glitch { opacity: 0; animation: glitch 12s steps(1,end) infinite; }
  .trace { stroke: #b6f45a; stroke-width: 2; fill: none; stroke-dasharray: 20 1080; animation: transmit 8s cubic-bezier(.4,0,.3,1) infinite; }
  .step { animation: step 12s steps(1,end) infinite; }
  .step-b { animation-delay: -9s; }
  .step-c { animation-delay: -6s; }
  .step-d { animation-delay: -3s; }
  @keyframes radar { to { transform: rotate(360deg); } }
  @keyframes ping { 0%,8% { opacity: 1; stroke-width: 2; } 30%,100% { opacity: .15; stroke-width: 1; } }
  @keyframes typing { 0%,3% { width: 0; } 23%,94% { width: 325px; } 98%,100% { width: 0; } }
  @keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes ready { 0%,22% { opacity: 0; } 23%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
  @keyframes phase { 0%,23% { fill: #9aafa0; } 24%,45% { fill: #b6f45a; } 46%,100% { fill: #9aafa0; } }
  @keyframes phase-b { 0%,45% { fill: #9aafa0; } 46%,68% { fill: #b6f45a; } 69%,100% { fill: #9aafa0; } }
  @keyframes phase-c { 0%,68% { fill: #9aafa0; } 69%,94% { fill: #b6f45a; } 95%,100% { fill: #9aafa0; } }
  @keyframes glitch { 0%,51% { opacity: 0; } 52% { opacity: .8; transform: translateX(3px); } 53% { opacity: .6; transform: translateX(-2px); } 54%,100% { opacity: 0; } }
  @keyframes transmit { 0% { stroke-dashoffset: 20; opacity: 0; } 8%,85% { opacity: 1; } 100% { stroke-dashoffset: -1080; opacity: 0; } }
  @keyframes step { 0%,24% { stroke: #b6f45a; } 25%,100% { stroke: #294431; } }
  @media all {
    *, *::before, *::after { animation: none !important; }
    .type-mask { width: 325px; }
    .cursor-ready { opacity: 1; }
    .glitch { display: none; }
    .trace { stroke-dasharray: none; opacity: .45; }
  }
</style>
<path d="M17 1H614L639 26V337L623 353H26L1 328V17Z" fill="#070d0a" stroke="#294431" stroke-width="2"/>
<text x="33" y="43" font-size="21" class="accent">01</text>
<circle cx="85" cy="36" r="5" class="step " fill="#070d0a" stroke="#294431" stroke-width="2"/>
<text x="110" y="43" font-size="24" class="accent">SCOPE</text>
<text x="110" y="71" font-size="21" class="muted">Define the boundaries</text>
<path d="M85 51V106" class="line"/>
<text x="33" y="128" font-size="21" class="accent">02</text>
<circle cx="85" cy="121" r="5" class="step step-b" fill="#070d0a" stroke="#294431" stroke-width="2"/>
<text x="110" y="128" font-size="24" class="accent">INSPECT</text>
<text x="110" y="156" font-size="21" class="muted">Follow the request</text>
<path d="M85 136V191" class="line"/>
<text x="33" y="213" font-size="21" class="accent">03</text>
<circle cx="85" cy="206" r="5" class="step step-c" fill="#070d0a" stroke="#294431" stroke-width="2"/>
<text x="110" y="213" font-size="24" class="accent">REPRODUCE</text>
<text x="110" y="241" font-size="21" class="muted">Verify the behavior</text>
<path d="M85 221V276" class="line"/>
<text x="33" y="298" font-size="21" class="accent">04</text>
<circle cx="85" cy="291" r="5" class="step step-d" fill="#070d0a" stroke="#294431" stroke-width="2"/>
<text x="110" y="298" font-size="24" class="accent">DOCUMENT</text>
<text x="110" y="326" font-size="21" class="muted">Keep the evidence</text>
</svg>
