name: Refresh public contribution calendar

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: profile-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check updater
        run: python -m unittest discover -s tests -v

      - name: Refresh public calendar
        run: python sync_profile.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-dark.svg assets/activity-light.svg
          if git diff --staged --quiet; then
            echo "Public calendar unchanged."
          else
            git commit -m "Refresh public contribution calendar"
            git pull --rebase origin main
            git push origin main
          fi
