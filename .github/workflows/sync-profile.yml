name: Daily profile maintenance

on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

concurrency:
  group: profile-maintenance
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Rome
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check updater
        run: python -m unittest discover -s tests -v

      - name: Refresh README and public calendar once per day
        run: python sync_profile.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity-dark.svg assets/activity-light.svg
          if git diff --staged --quiet; then
            echo "Today's automated maintenance is already recorded."
          else
            git commit --author="StealthMoud <152169815+StealthMoud@users.noreply.github.com>" -m "chore(profile): daily automated maintenance"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin main; then
                exit 0
              fi
            done
            exit 1
          fi
